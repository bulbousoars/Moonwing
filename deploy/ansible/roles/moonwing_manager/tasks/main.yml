---
- name: Ensure moonwing manager install directory exists
  ansible.builtin.file:
    path: "{{ moonwing_manager_install_dir }}"
    state: directory
    owner: "{{ moonwing_manager_user }}"
    group: "{{ moonwing_manager_group }}"
    mode: "0755"

- name: Sync moonwing manager source tree from local checkout
  ansible.posix.synchronize:
    src: "{{ moonwing_manager_local_src }}/"
    dest: "{{ moonwing_manager_install_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.merge-staging"
      - "--exclude=.pytest_cache"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=*.bak"
      - "--exclude=*.bak-*"
      - "--exclude=.env"
      - "--exclude=venv"
      - "--exclude=build"
      - "--exclude=dist"
      - "--exclude=*.egg-info"
  notify:
    - Restart moonwing api
    - Restart moonwing worker

- name: Ensure ownership of install dir is correct
  ansible.builtin.file:
    path: "{{ moonwing_manager_install_dir }}"
    owner: "{{ moonwing_manager_user }}"
    group: "{{ moonwing_manager_group }}"
    recurse: true

- name: Ensure venv exists
  ansible.builtin.command:
    cmd: "{{ moonwing_manager_python }} -m venv {{ moonwing_manager_venv_dir }}"
    creates: "{{ moonwing_manager_venv_dir }}/bin/python"
  become_user: "{{ moonwing_manager_user }}"

- name: Install moonwing into venv (editable)
  ansible.builtin.command:
    cmd: "{{ moonwing_manager_venv_dir }}/bin/pip install -e ."
    chdir: "{{ moonwing_manager_install_dir }}"
  become_user: "{{ moonwing_manager_user }}"
  changed_when: true
  notify:
    - Restart moonwing api
    - Restart moonwing worker

- name: Run alembic migrations
  ansible.builtin.command:
    cmd: "{{ moonwing_manager_venv_dir }}/bin/alembic -c alembic.ini upgrade head"
    chdir: "{{ moonwing_manager_install_dir }}"
  environment:
    PYTHONPATH: "{{ moonwing_manager_install_dir }}/src"
  become_user: "{{ moonwing_manager_user }}"
  when: moonwing_manager_run_migrations | bool
  changed_when: true

- name: Install moonwing-api systemd unit
  ansible.builtin.template:
    src: moonwing-api.service.j2
    dest: /etc/systemd/system/moonwing-api.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart moonwing api

- name: Install moonwing-worker systemd unit
  ansible.builtin.template:
    src: moonwing-worker.service.j2
    dest: /etc/systemd/system/moonwing-worker.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart moonwing worker

- name: Enable and start moonwing-api
  ansible.builtin.systemd_service:
    name: moonwing-api
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start moonwing-worker
  ansible.builtin.systemd_service:
    name: moonwing-worker
    enabled: true
    state: started
    daemon_reload: true
