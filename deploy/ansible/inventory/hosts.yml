---
# Copy to hosts.yml and replace SET_ME_* placeholders (or use group_vars / vault).
# Never commit real IPs, personal usernames, or tokens to a shared public branch.
all:
  children:
    moonwing_manager:
      hosts:
        moonwing_manager_primary:
          ansible_host: SET_ME_MANAGER_IP_OR_DNS
          ansible_user: SET_ME_SSH_USER
          ansible_python_interpreter: /usr/bin/python3
    moonwing_sensors:
      hosts: {}
      # Example:
      # sensor_host_a:
      #   ansible_host: 10.0.0.70
      #   ansible_user: moonwing
