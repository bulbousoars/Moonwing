services:
  moonwing-migrate:
    profiles: ["app"]
    build: .
    restart: "no"
    env_file: .env
    environment:
      MOONWING_DATABASE_URL: postgresql+psycopg://moonwing:moonwing@postgres:5432/moonwing
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "-c", "/app/alembic.ini", "upgrade", "head"]

  moonwing-api:
    profiles: ["app"]
    build: .
    command: ["python", "-m", "uvicorn", "moonwing.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MOONWING_DATABASE_URL: postgresql+psycopg://moonwing:moonwing@postgres:5432/moonwing
      MOONWING_QUEUE_BACKEND: redis://redis:6379/0
      MOONWING_OBJECT_STORAGE_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      moonwing-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  moonwing-worker:
    profiles: ["app"]
    build: .
    command: ["python", "-m", "moonwing.worker.main"]
    env_file: .env
    environment:
      MOONWING_DATABASE_URL: postgresql+psycopg://moonwing:moonwing@postgres:5432/moonwing
      MOONWING_QUEUE_BACKEND: redis://redis:6379/0
      MOONWING_OBJECT_STORAGE_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      moonwing-migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moonwing
      POSTGRES_USER: moonwing
      POSTGRES_PASSWORD: moonwing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonwing -d moonwing"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
  miniodata:
