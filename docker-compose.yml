services:
  moonwing-api:
    profiles: ["app"]
    build: .
    command: ["python", "-m", "uvicorn", "moonwing.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MOONWING_DATABASE_URL: postgresql+psycopg://moonwing:moonwing@postgres:5432/moonwing
      MOONWING_QUEUE_BACKEND: redis://redis:6379/0
      MOONWING_OBJECT_STORAGE_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  moonwing-worker:
    profiles: ["app"]
    build: .
    command: ["python", "-m", "moonwing.worker.main"]
    env_file: .env
    environment:
      MOONWING_DATABASE_URL: postgresql+psycopg://moonwing:moonwing@postgres:5432/moonwing
      MOONWING_QUEUE_BACKEND: redis://redis:6379/0
      MOONWING_OBJECT_STORAGE_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moonwing
      POSTGRES_USER: moonwing
      POSTGRES_PASSWORD: moonwing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
