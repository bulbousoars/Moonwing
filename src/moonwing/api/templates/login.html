{% extends "base.html" %}
{% block title %}Login - Moonwing{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-panel">
    <div class="sidebar-logo auth-logo">
      <img src="/static/img/moonwing-logo.png" alt="">
    </div>
    <h1>Sign in to Moonwing</h1>
    <p>Use a local username or email identifier.</p>
    {% if error %}
    <div class="probe-result error">{{ error }}</div>
    {% endif %}
    {% if oidc_enabled %}
    <a class="btn btn-primary auth-submit" href="/auth/oidc/login?next={{ next }}">Sign in with OIDC</a>
    <div class="auth-divider"><span>or</span></div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" required autocomplete="username" placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
