{% extends "base.html" %}
{% block title %}New Credential — Moonwing{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New Credential</h1>
  <p>Add an API key or provider credential</p>
</div>

<div class="detail-card" style="max-width:600px">
  <form method="post" action="/credentials/new">
    <div class="form-group">
      <label for="display_name">Display Name</label>
      <input type="text" id="display_name" name="display_name" required placeholder="e.g. My OpenAI Key">
    </div>
    <div class="form-group">
      <label for="provider">Provider</label>
      <select id="provider" name="provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="openrouter">OpenRouter</option>
        <option value="ollama">Ollama (no key needed)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="scope">Scope</label>
      <select id="scope" name="scope">
        <option value="user">User</option>
        <option value="shared">Shared</option>
      </select>
    </div>
    <div class="form-group" id="api_key_group">
      <label for="api_key">API Key <span style="color:var(--text-muted)">(optional for CLI mode)</span></label>
      <input type="password" id="api_key" name="api_key" placeholder="sk-..." autocomplete="off">
      <small style="color:var(--text-muted)">Required for API execution mode. For CLI mode, claude/codex use their own login — no key needed.</small>
    </div>
    <div class="form-group">
      <label for="owner_user_id">Owner User ID (optional)</label>
      <input type="text" id="owner_user_id" name="owner_user_id" placeholder="UUID of owning user">
    </div>
    <button type="submit" class="btn btn-primary">Create Credential</button>
  </form>
</div>

<script>
document.getElementById('provider').addEventListener('change', function() {
  var group = document.getElementById('api_key_group');
  group.style.display = (this.value === 'ollama') ? 'none' : '';
});
</script>
{% endblock %}
