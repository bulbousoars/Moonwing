[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moonwing"
version = "0.1.0"
description = "Moonwing Clearwing orchestration platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "minio>=7.2,<8.0",
  "cryptography>=44.0,<45.0",
  "ldap3>=2.9,<3.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["moonwing*", "moonwing_sensor*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
