---
- name: Restart moonwing api
  ansible.builtin.systemd_service:
    name: moonwing-api
    state: restarted
    daemon_reload: true
  when: moonwing_manager_restart_services | bool

- name: Restart moonwing worker
  ansible.builtin.systemd_service:
    name: moonwing-worker
    state: restarted
    daemon_reload: true
  when: moonwing_manager_restart_services | bool
